name: J.A.R.V.I.S. Review

on:
  issue_comment:
    types: [created]

jobs:
  checkstyle-review:
    if: |
      github.event.issue.pull_request &&
      contains(github.event.comment.body, '/jarvis review') &&
      github.event.comment.user.type != 'Bot'

    name: J.A.R.V.I.S. PR Reviewer
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: refs/pull/${{ github.event.issue.number }}/head
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"
          cache: "maven"

      - name: Make Maven Wrapper executable
        run: chmod +x mvnw

      - name: Compile project with Maven Wrapper
        run: ./mvnw clean compile

      - name: Create Mock PR Event Payload
        run: |
          jq -n \
            --argjson pr_num "${{ github.event.issue.number }}" \
            --arg owner "${{ github.repository_owner }}" \
            --arg repo "${{ github.event.repository.name }}" \
            '{"pull_request": {"number": $pr_num}, "repository": {"owner": {"login": $owner}, "name": $repo}}' > /tmp/mock_event.json

      - name: Run Checkstyle with Reviewdog
        id: checkstyle_run
        continue-on-error: true
        uses: dbelyaev/action-checkstyle@v3
        env:
          GITHUB_EVENT_NAME: pull_request
          GITHUB_EVENT_PATH: /tmp/mock_event.json
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          reporter: github-pr-review
          level: warning
          fail_level: warning
          filter_mode: added
          tool_name: "J.A.R.V.I.S. Review"

      - name: J.A.R.V.I.S. Voice Response
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          PR_NUMBER=${{ github.event.issue.number }}
          OUTCOME="${{ steps.checkstyle_run.outcome }}"
          if [ "$OUTCOME" = "failure" ]; then
            MSG="Às suas ordens, senhor. Concluí a análise de estilo e encontrei algumas 'peculiaridades artísticas' nos seus commits recentes. Anotei as anomalias na aba **Files changed** para a sua atenção. Sugiro dar uma olhada, a menos que esteja tentando inaugurar um movimento pós-moderno de formatação de código."
          elif [ "$OUTCOME" = "success" ]; then
            MSG="Às suas ordens, senhor. A análise está completa e, para minha extrema surpresa, seu código está impecável e segue todos os padrões de estilo. Suponho que parabéns sejam devidos, embora eu estivesse secretamente esperando o desafio de corrigir seus deslizes. Excelente trabalho."
          else
            MSG="Mil perdões, senhor. Minhas sub-rotinas falharam miseravelmente ao analisar seu código. Presumo que a complexidade da sua lógica tenha sobrecarregado meus sistemas. Investigarei meus circuitos imediatamente."
          fi
          gh pr comment $PR_NUMBER --body "$MSG"
